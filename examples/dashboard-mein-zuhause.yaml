# Beispiel-Dashboard „Mein Zuhause“ (Musterdaten: Bewohnerin „Erika“)
# Dashboard anlegen (URL-Pfad: mein-zuhause), Rohkonfiguration öffnen und diesen Inhalt einfügen.
# Benötigt: card/mein-zuhause-card.js und navbar-card als Dashboard-Ressourcen (Typ: JavaScript-Modul).
title: Mein Zuhause
views:
  - title: Start
    path: start
    icon: mdi:home
    theme: mein_zuhause
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mein-zuhause-card
            screen: start
            bewohner: Erika
            entities:
              person: person.erika
              netz: sensor.stromzaehler_leistung
              bezug: sensor.stromzaehler_bezug
            pv_kwp: 1.5
            auto_name: Kleiner Stromer
          - type: custom:navbar-card
            desktop: {position: bottom, show_labels: true}
            mobile: {show_labels: true}
            routes:
              - {url: /mein-zuhause/einstellen, icon: mdi:account-cog-outline, icon_selected: mdi:account-cog, label: Einstellen}
              - {url: /mein-zuhause/auto, icon: mdi:car-electric-outline, icon_selected: mdi:car-electric, label: Auto}
              - {url: /mein-zuhause/energie, icon: mdi:white-balance-sunny, label: Energie}
              - {url: /mein-zuhause/werner, icon: mdi:shield-account-outline, icon_selected: mdi:shield-account, label: Werner}
              - {url: /mein-zuhause/start, icon: mdi:home-outline, icon_selected: mdi:home, label: Start}
