# Theme „mein_zuhause“ – hell, ruhig, gut lesbar (Atkinson Hyperlegible)
# Schrift als Dashboard-Ressource einbinden (CSS):
#   https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap
mein_zuhause:
  modes:
    light:
      primary-font-family: "Atkinson Hyperlegible, system-ui, sans-serif"
      ha-font-family-body: "Atkinson Hyperlegible, system-ui, sans-serif"
      ha-font-family-heading: "Atkinson Hyperlegible, system-ui, sans-serif"
      ha-font-size-m: "17px"
      ha-font-size-l: "19px"
      primary-color: "#1F4E79"
      accent-color: "#2E6B4F"
      primary-background-color: "#F5F2EA"
      secondary-background-color: "#EFEBE2"
      lovelace-background: "#F5F2EA"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      ha-card-border-radius: "20px"
      ha-card-border-color: "#E2DDD1"
      ha-card-border-width: "1px"
      ha-card-box-shadow: "none"
      primary-text-color: "#1E2421"
      secondary-text-color: "#55605A"
      app-header-background-color: "#FFFFFF"
      app-header-text-color: "#1E2421"
      app-header-selection-bar-color: "#1F4E79"
      sidebar-background-color: "#FFFFFF"
      success-color: "#2E6B4F"
      warning-color: "#B5651D"
      error-color: "#A3261D"
      info-color: "#1F4E79"
      state-icon-color: "#1F4E79"
